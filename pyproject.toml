[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "athar-ifc"
version = "0.1.0"
description = "Semantic IFC diff engine"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
]
dependencies = [
  "ifcopenshell",
]

[project.urls]
Repository = "https://github.com/Amixx/Athar"

[project.optional-dependencies]
benchmark = [
  "ifcdiff",
  "ifcfast",
  "pytest",
  "specklepy",
]
benchmark-ui = [
  "fastapi",
  "uvicorn",
]

[project.scripts]
athar = "athar.__main__:main"
athar-benchmark-ui = "athar_bench.ui:main"

[tool.maturin]
manifest-path = "athar/_native/Cargo.toml"
module-name = "athar_native"
python-packages = [
  "athar",
  "athar_bench",
  "athar_dev",
  "athar_git",
  "athar_qa",
  "athar_store",
  "athar_view",
]
include = [
  { path = "athar_view/static/**/*", format = ["sdist", "wheel"] },
]
exclude = [
  { path = "athar/_native/**/*", format = "wheel" },
  { path = "**/__pycache__/**/*", format = "wheel" },
  { path = "**/AGENTS.md", format = ["sdist", "wheel"] },
  { path = "**/CLAUDE.md", format = ["sdist", "wheel"] },
]

[tool.pytest.ini_options]
markers = [
  "large_acceptance: opt-in large IFC acceptance coverage",
]
