name: Benchmark dashboard

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate benchmark even if a cached JSON artifact exists"
        required: false
        default: "false"
  schedule:
    - cron: "17 4 * * 1" # 04:17 UTC Mondays
  push:
    branches: [main]
    paths:
      - "athar/**"
      - "athar_dev/**"
      - "athar_bench/**"
      - "scripts/explore/benchmark_competitors.py"
      - "tests/corpus.py"
      - "corpus/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/benchmark-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark-dashboard-pages
  cancel-in-progress: true

jobs:
  benchmark-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (LFS pointers only)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compute LFS objects cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Fetch LFS content
        run: |
          git lfs install --local
          git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore benchmark JSON cache
        id: benchmark-cache
        uses: actions/cache@v4
        with:
          path: .athar-benchmark/competitor-benchmark.json
          key: >-
            benchmark-${{ runner.os }}-${{ hashFiles('athar/**/*.py', 'athar_dev/**/*.py', 'scripts/explore/benchmark_competitors.py', 'tests/corpus.py', 'corpus/**/*.ifc', 'corpus/**/*.IFC', 'pyproject.toml') }}

      - name: Install benchmark dependencies
        if: steps.benchmark-cache.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        run: python -m pip install '.[benchmark]'

      - name: Run benchmark
        if: steps.benchmark-cache.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        run: make benchmark-run BENCHMARK_REPEATS=3 BENCHMARK_TIMEOUT_S=300

      - name: Build static dashboard
        run: make benchmark-page

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .athar-benchmark/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
