name: Nightly large IFC acceptance

# The large acceptance tier (tests/test_acceptance_large_ifc.py) parses the
# multi-hundred-MB corpus and is far too slow for normal development runs, so
# it is env-gated off locally and runs here on a nightly schedule instead.
# Corpus files that are absent (e.g. the optional external corpus) skip
# individually, so this run covers the repo-LFS corpus.

on:
  schedule:
    - cron: "23 2 * * *" # 02:23 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout (LFS pointers only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false

      # LFS bandwidth is metered (~650MB corpus vs 1GB/month free), so the
      # object store is cached across runs and the nightly cadence keeps the
      # cache warm; `git lfs pull` only downloads objects missing from it.
      - name: Compute LFS objects cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS object cache
        id: lfs-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/lfs
          key: lfs-all-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-all-

      - name: Fetch LFS content
        run: |
          git lfs install --local
          git lfs pull

      - name: Save LFS object cache
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/lfs
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: athar/_native

      - name: Build Athar with the native extension
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pytest
          make native-build

      - name: Fast default suite (smoke gate)
        run: .venv/bin/python -m pytest tests/ -q

      - name: Large acceptance suite
        env:
          ATHAR_RUN_LARGE_ACCEPTANCE: "1"
          # Per-test wall-clock bound; the 182MB model parse alone can take
          # ~30-60 min on a standard runner.
          ATHAR_ACCEPTANCE_TIMEOUT_S: "5400"
        run: .venv/bin/python -m pytest tests/test_acceptance_large_ifc.py -q --durations=20
