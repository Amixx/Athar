name: Python release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Where to publish the built Python distributions"
        required: true
        default: "artifact"
        type: choice
        options:
          - artifact
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build viewer bundle for package data
        run: make viewer-package-static

      - uses: actions/upload-artifact@v4
        with:
          name: viewer-static
          path: athar_view/static/
          if-no-files-found: error

  wheels:
    needs: viewer
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x86_64
            runner: windows-latest
            target: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: viewer-static
          path: athar_view/static

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist

      - name: Smoke-test the wheel
        uses: ./.github/actions/smoke-install
        with:
          dist: dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: viewer-static
          path: athar_view/static

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Smoke-test a build from the sdist
        uses: ./.github/actions/smoke-install
        with:
          dist: dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: inputs.publish != 'artifact'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        if: inputs.publish == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: inputs.publish == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
