[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athar"
version = "0.1.0"
description = "Semantic IFC diff engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ifcopenshell",
  "xxhash",
]

[tool.setuptools.packages.find]
include = ["athar*", "athar_layers*"]

[project.scripts]
athar = "athar.__main__:main"

[tool.pytest.ini_options]
markers = [
  "large_acceptance: opt-in large IFC acceptance coverage",
  "medium_regression: medium-weight regression checks on house fixtures",
]
