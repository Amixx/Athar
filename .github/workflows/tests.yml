name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (LFS pointers only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The registry only needs paths, so it runs before any LFS content exists.
      - name: List the default suite's LFS files
        run: |
          python -m pip install pytest
          list=$(python -m tests.corpus --default-lfs)
          test -n "$list"
          echo "DEFAULT_SUITE_LFS=$list" >> "$GITHUB_ENV"

      # LFS bandwidth is metered (~650MB corpus vs 1GB/month free), so the
      # default-suite objects are cached; runs on main save the cache that PR
      # runs restore, and `git lfs pull` only downloads objects missing from it.
      - name: Compute LFS objects cache key
        run: git lfs ls-files -l -I "$DEFAULT_SUITE_LFS" | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS object cache
        id: lfs-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/lfs
          key: lfs-default-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-default-

      - name: Fetch LFS content
        run: |
          git lfs install --local
          git lfs pull --include="$DEFAULT_SUITE_LFS"

      - name: Save LFS object cache
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/lfs
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: athar/_native

      - name: Build Athar with the native extension
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pytest pyyaml
          make native-build

      - name: Default suite
        run: .venv/bin/python -m pytest tests/ -q
