name: Athar IFC PR Diff

on:
  pull_request:
    paths:
      - "**.ifc"
      - "**.IFC"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: athar-pr-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  athar-ifc-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: athar/_native

      - name: Install Athar
        run: python -I -m pip install -e .

      - name: Post IFC diff comment
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          athar git pr-comment
          --base "$BASE_SHA" --head "$HEAD_SHA" --repo "$REPOSITORY" --pr "$PR_NUMBER"

      # Fork and Dependabot pull requests get a read-only token, so the comment goes to the job summary.
      - name: Write IFC diff to the job summary
        if: github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'
        run: >-
          athar git pr-comment --dry-run
          --base "$BASE_SHA" --head "$HEAD_SHA" --repo "$REPOSITORY" --pr "$PR_NUMBER"
          >> "$GITHUB_STEP_SUMMARY"
