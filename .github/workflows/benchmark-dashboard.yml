name: Benchmark dashboard

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate benchmark even if a cached JSON artifact exists"
        required: false
        default: "false"
  schedule:
    - cron: "17 4 * * 1" # 04:17 UTC Mondays
  push:
    branches: [main]
    paths:
      - "athar/**"
      - "athar_dev/**"
      - "athar_bench/**"
      - "scripts/explore/benchmark_competitors.py"
      - "scripts/explore/speckle*"
      - "tests/corpus.py"
      - "corpus/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/benchmark-dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark-dashboard-pages
  cancel-in-progress: true

jobs:
  benchmark-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (LFS pointers only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false

      - name: Compute LFS objects cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS object cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Fetch LFS content
        run: |
          git lfs install --local
          git lfs pull

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Restore benchmark JSON cache
        id: benchmark-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .athar-benchmark/competitor-benchmark.json
          key: >-
            benchmark-${{ runner.os }}-${{ hashFiles('athar/**/*', 'athar_dev/**/*', 'scripts/explore/benchmark_competitors.py', 'scripts/explore/speckle*', 'tests/corpus.py', 'corpus/**/*', 'pyproject.toml') }}

      - name: Install benchmark dependencies
        if: steps.benchmark-cache.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        run: make benchmark-setup

      - name: Run benchmark
        if: steps.benchmark-cache.outputs.cache-hit != 'true' || github.event.inputs.force == 'true'
        run: make benchmark-run BENCHMARK_REPEATS=3 BENCHMARK_TIMEOUT_S=300

      - name: Build static dashboard
        run: make benchmark-page

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .athar-benchmark/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
