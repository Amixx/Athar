[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athar"
version = "0.1.0"
description = "Semantic IFC diff engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ifcopenshell",
]

[project.optional-dependencies]
benchmark = [
  "ifcdiff",
  "ifcfast",
]
benchmark-ui = [
  "fastapi",
  "uvicorn",
]
# Build-time tooling for the optional Rust accelerator (athar/_native).
# Runtime requires nothing extra: athar.bottom imports `athar_native` when it
# is present and falls back to pure Python otherwise.
native = [
  "maturin>=1.5,<2.0",
]

[tool.setuptools.packages.find]
include = ["athar*", "athar_git*", "athar_store*"]

[tool.setuptools.package-data]
# Optional wheel-bundled viewer SPA: copy viewer/dist to athar_view/static
# before building a release wheel (see athar_view.server.find_dist).
athar_view = ["static/**/*"]

[project.scripts]
athar = "athar.__main__:main"
athar-benchmark-ui = "athar_bench.ui:main"

[tool.pytest.ini_options]
markers = [
  "large_acceptance: opt-in large IFC acceptance coverage",
]
